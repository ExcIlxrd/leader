<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leader Engineering — прототип сайта</title>

<!-- Точка входа репозитория.
     Сам сайт лежит в /prototype: там же живут сборщик страниц услуг и
     общая таблица стилей, поэтому переносить его в корень значило бы
     ломать относительные пути внутри services/ и архива.
     Эта страница только переводит посетителя на сайт.

     GitHub Pages: Settings → Pages → Source: Deploy from a branch,
     Branch: main, папка / (root). Тогда корень отдаёт этот файл,
     а он уводит на /prototype/. -->

<meta http-equiv="refresh" content="0; url=prototype/index.html">
<link rel="canonical" href="prototype/index.html">
<meta name="robots" content="noindex, follow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="color-scheme" content="light dark">

<!-- Страница самодостаточна: ни одного внешнего запроса, поэтому политика
     максимально узкая. Скрипта здесь нет намеренно — переход делает
     meta refresh, и 'unsafe-inline' для скриптов не требуется.
     frame-ancestors здесь не указываем: в <meta> браузер её игнорирует,
     она работает только заголовком, а GitHub Pages заголовки не отдаёт. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">

<style>
  :root{
    color-scheme:light;
    --bg:#F5F7FA; --panel:#FFFFFF; --brand:#003362;
    --ink:#142B40; --muted:#526477; --line:#DCE4ED;
    --primary:#0755B5; --on-primary:#FFFFFF;
  }
  @media (prefers-color-scheme:dark){
    :root{
      color-scheme:dark;
      --bg:#061B2D; --panel:#003362; --brand:#FFFFFF;
      --ink:#FFFFFF; --muted:#B7C7D8; --line:#123A5E;
      --primary:#1F6FDD;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0;min-height:100svh;display:grid;place-items:center;padding:32px;
    background:var(--bg);color:var(--muted);
    font:400 17px/1.6 'Manrope','Segoe UI',system-ui,-apple-system,sans-serif;
  }
  .card{
    max-width:520px;width:100%;padding:clamp(26px,5vw,40px);
    background:var(--panel);border:1px solid var(--line);border-radius:16px;
    text-align:center;
  }
  .mark{
    display:inline-block;font-size:13px;font-weight:700;letter-spacing:.16em;
    text-transform:uppercase;color:var(--brand);margin-bottom:22px;
  }
  h1{margin:0 0 12px;font-size:clamp(24px,4vw,30px);line-height:1.2;letter-spacing:-.02em;color:var(--ink)}
  p{margin:0 0 26px}
  a.go{
    display:inline-block;padding:14px 26px;border-radius:10px;
    background:var(--primary);color:var(--on-primary);
    font-weight:600;text-decoration:none;
  }
  a.go:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .links{margin-top:24px;padding-top:20px;border-top:1px solid var(--line);font-size:15px}
  .links a{color:var(--primary);text-decoration:none}
  .links a:hover{text-decoration:underline}
</style>
</head>
<body>
  <main class="card">
    <span class="mark">Leader Engineering</span>
    <h1>Прототип сайта</h1>
    <p>Сейчас откроется главная страница. Если переход не сработал, нажмите кнопку.</p>
    <a class="go" href="prototype/index.html">Открыть сайт</a>
    <div class="links">
      <a href="prototype/services/technadzor/index.html">Страница услуги: технадзор</a>
    </div>
  </main>
</body>
</html>
